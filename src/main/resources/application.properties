spring.application.name=UniBridge

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/unibridge?serverTimezone=UTC&characterEncoding=UTF-8

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:u_unibridge}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

spring.ai.model.chat=ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:gemma3:1b}
spring.ai.ollama.chat.options.temperature=${OLLAMA_CHAT_TEMPERATURE:0.2}
unibridge.ai.enabled=${UNIBRIDGE_AI_ENABLED:true}