<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>질문 등록 | UniBridge</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" th:href="@{/css/UniBridge.css}" href="/css/UniBridge.css">
</head>
<body class="board-page">

<main class="form-main-container">
    <div class="board-form-container">
        <header class="board-form-header">
            <h1>선배들에게 질문하기</h1>
        </header>

        <form th:action="@{/board/ask}" th:object="${boardForm}" method="post">
            <div class="form-card">
                <div class="form-group">
                    <label for="company-search">커뮤니티</label>
                    <p class="form-group-description">질문을 올릴 커뮤니티를 선택하세요. 특정 회사가 아니라면 'Random'을 선택하세요.</p>
                    <input type="text" id="company-search" class="form-control" placeholder="검색 후 아래에서 선택하기...">
                    <select id="companyId" th:field="*{companyId}" class="form-control" th:classappend="${#fields.hasErrors('companyId')} ? 'is-invalid'" style="margin-top: 10px;">
                        <option value="" disabled selected>커뮤니티 선택하기</option>
                        <option value="0">Random (모든 회사)</option>
                        <option th:each="company : ${companies}"
                                th:value="${company.id}"
                                th:text="${company.name}">Company Name</option>
                    </select>
                    <span class="error-message" th:if="${#fields.hasErrors('companyId')}" th:errors="*{companyId}">Error</span>
                </div>
            </div>

            <div class="form-card">
                <div class="form-group">
                    <label for="title">제목</label>
                    <p class="form-group-description">질문은 간결하고 본문 내용을 함축하고 있으면 좋아요.</p>
                    <input type="text" id="title" th:field="*{title}" class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'" placeholder="예시: 요즘 채용 분위기가 어떤가요?">
                    <span class="error-message" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Error</span>
                </div>
            </div>

            <div class="form-card">
                <div class="form-group">
                    <label for="content">본문</label>
                    <p class="form-group-description">커뮤니티 이용 수칙을 준수해주세요.</p>
                    <textarea id="content" th:field="*{content}" class="form-control" th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'" rows="10"></textarea>
                    <span class="error-message" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">Error</span>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="board-write-button">질문 등록하기</button>
                <a th:href="@{/board}" class="btn btn-secondary">취소하기</a>
            </div>
        </form>
    </div>
</main>
<script th:src="@{/js/board_form.js}"></script>
</body>
</html>
