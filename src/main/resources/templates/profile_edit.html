<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" th:href="@{/css/UniBridge.css}" href="/css/UniBridge.css">
    <style>
        .profile-checkbox-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .profile-checkbox-item {
            display: flex;
            align-items: center;
        }
        .profile-checkbox-item input {
            margin-right: 8px;
        }
        .error-message {
            color: red;
            font-size: 0.8em;
        }
    </style>
</head>
<body class="profile-edit-body">
    <div class="profile-form-container">
        <h1>프로필 정보 수정</h1>
        <form id="profileForm" th:action="@{/profile/edit}" th:object="${profileForm}" method="post">
            <div th:if="${#fields.hasErrors('*')}" class="error-message">
                <p>Please correct the errors below.</p>
            </div>
            <div class="profile-form-row">
                <div class="profile-form-group">
                    <label for="gpa">내 학점 (GPA)</label>
                    <input type="number" step="0.01" id="gpa" th:field="*{gpa}" placeholder="학점 평균" />
                    <span th:if="${#fields.hasErrors('gpa')}" th:errors="*{gpa}" class="error-message"></span>
                </div>
                <div class="profile-form-group">
                    <label for="maxGpa">만점 기준</label>
                    <input type="number" step="0.01" id="maxGpa" th:field="*{maxGpa}" placeholder="예: 4.5" />
                    <span th:if="${#fields.hasErrors('maxGpa')}" th:errors="*{maxGpa}" class="error-message"></span>
                </div>
            </div>

            <div class="profile-form-group">
                <label for="languageScore">어학 점수 (TOEIC)</label>
                <input type="number" id="languageScore" th:field="*{languageScore}" min="100" max="990" placeholder="현재는 토익 점수만 지원해요." />
                <span th:if="${#fields.hasErrors('languageScore')}" th:errors="*{languageScore}" class="error-message"></span>
            </div>

            <div class="profile-form-group">
                <label for="awardCount">수상 횟수</label>
                <input type="number" id="awardCount" th:field="*{awardCount}" max="50" placeholder="직무와 관련된 공신력 있는 기관의 수상 기록만 작성해주세요." />
                <span th:if="${#fields.hasErrors('awardCount')}" th:errors="*{awardCount}" class="error-message"></span>
            </div>

            <div class="profile-form-group">
                <label for="projectSummary">프로젝트 요약</label>
                <textarea id="projectSummary" th:field="*{projectSummary}" maxlength="150" placeholder="진행한 대표 프로젝트에 대한 내용을 150자 이내로 작성해주세요."></textarea>
                <span th:if="${#fields.hasErrors('projectSummary')}" th:errors="*{projectSummary}" class="error-message"></span>
            </div>

            <div class="profile-form-group">
                <label for="portfolioDescription">포트폴리오 설명</label>
                <textarea id="portfolioDescription" th:field="*{portfolioDescription}" maxlength="150" placeholder="자신의 전체적인 포트폴리오를 150자 이내로 요약하여 작성해주세요."></textarea>
                <span th:if="${#fields.hasErrors('portfolioDescription')}" th:errors="*{portfolioDescription}" class="error-message"></span>
            </div>

            <div class="profile-form-group">
                <label>보유 자격증</label>
                <div class="profile-checkbox-grid">
                    <div th:each="cert, stat : ${certifications}" class="profile-checkbox-item">
                        <input type="checkbox" th:id="'cert-' + ${stat.index}" th:field="*{certificationIds}" th:value="${cert.certificationId}">
                        <label th:for="${'cert-' + stat.index}" th:text="${cert.name}">Certification Name</label>
                    </div>
                </div>
            </div>

            <button type="submit">저장하기</button>
        </form>
    </div>

    <script th:src="@{/js/profile_edit.js}" src="/js/profile_edit.js"></script>
</body>
</html>
