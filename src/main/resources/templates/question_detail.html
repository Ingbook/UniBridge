<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${question.title} + ' | UniBridge'">Question Detail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" th:href="@{/css/UniBridge.css}" href="/css/UniBridge.css">
    <style>
        .board-shell-detail {
            max-width: 1000px; /* Wider */
            margin: 2rem auto;
            padding: 0 1rem;
            display: flex;
            flex-direction: column;
            align-items: center; /* Center everything */
        }
        .board-feed-detail {
            width: 100%; /* Take up all available space in max-width */
        }
        .thread-view {
            display: flex;
            gap: 1rem;
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            border: 1px solid #e0e0e0;
            width: 100%;
        }
        .thread-voting {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
            width: 50px;
        }
        .vote-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 4px;
            color: #888;
            transition: color 0.2s, background-color 0.2s;
        }
        .vote-btn:hover {
            background: #f0f0f0;
        }
        .vote-btn.voted {
            color: #6a0dad; /* Purple */
        }
        .vote-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        .vote-btn svg {
            width: 24px;
            height: 24px;
        }
        .vote-score {
            font-weight: bold;
            font-size: 1.2rem;
            color: #333;
        }
        .thread-main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .thread-header {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 1rem;
        }
        .thread-header a, .thread-header span, .thread-header time {
            margin-right: 0.5rem;
        }
        .thread-title {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.3;
        }
        .thread-body {
            line-height: 1.7;
            font-size: 1rem;
            color: #333;
        }
        .answers-section {
            width: 100%;
        }
        .answer-form {
            width: 100%;
        }
    </style>
</head>
<body class="board-page">
<nav class="navbar board-navbar">
    <a class="nav-brand" th:href="@{/home}" href="/home">
        <img th:src="@{/images/unibridge_logo.png}" src="/images/unibridge_logo.png"
             alt="UniBridge Logo" class="service-logo">
        <span class="service-name">Unibridge</span>
    </a>
    <div class="nav-links">
        <a class="nav-login-link" th:href="@{/login}" href="/login">
            <svg class="nav-login-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                <path d="M10 17l5-5-5-5"></path>
                <path d="M15 12H3"></path>
            </svg>
            <span>학생 로그인</span>
        </a>
    </div>
</nav>

<div class="board-shell-detail" style="margin-top: 6rem;">
    <main class="board-feed-detail">

        <div class="thread-view">
            <div class="thread-voting">
                <button class="vote-btn up-vote" th:attr="data-question-id=${question.id}">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4 3 15h6v5h6v-5h6z"/></svg>
                </button>
                <span class="vote-score" th:text="${question.votes != null ? question.votes : 0}">0</span>
            </div>
            <div class="thread-main">
                <div class="thread-header">
                    <a th:href="@{/board(company=${question.companyName})}" class="board-thread-company" th:text="${question.companyName}">CompanyName</a>
                    <span>Posted by <span th:text="${question.writerName}">User</span></span>
                    <time th:if="${question.createdAt}" th:datetime="${question.createdAt}" th:text="${#temporals.format(question.createdAt, 'yy.MM.dd HH:mm')}">24.01.01 00:00</time>
                </div>
                <h1 class="thread-title" th:text="${question.title}">Question Title</h1>
                <div class="thread-body" th:text="${question.content}">Question content.</div>
            </div>
        </div>

        <div class="answers-section" style="margin-top: 2rem;">
            <h2 class="answers-title" th:text="${#lists.size(question.answers)} + ' Answers'">Answers</h2>

            <div th:each="answer : ${question.answers}" class="answer-card" th:classappend="${answer.accepted} ? 'accepted'">
                <div class="answer-header">
                    <span class="answer-writer" th:text="${answer.writerName}">Answer Writer</span>
                </div>
                <p class="answer-content" th:text="${answer.content}">Answer content.</p>
            </div>

            <div th:if="${#lists.isEmpty(question.answers)}" class="no-answers">
                <p>아직 답변이 없습니다. 첫 번째 답변을 달아주세요!</p>
            </div>
        </div>

        <div class="answer-form">
            <form th:action="@{/question/{questionId}/answer(questionId=${question.id})}" method="post">
                <div class="form-group">
                    <label for="content" class="answer-form-label">답변하기</label>
                    <textarea id="content" name="content" class="form-control" rows="6" placeholder="현직자의 경험을 바탕으로 답변을 남겨주세요."></textarea>
                </div>
                <div class="form-actions form-actions-centered">
                    <button type="submit" class="board-write-button" style="width: auto; padding: 0.8rem 1.5rem;">답변 등록</button>
                </div>
            </form>
        </div>
    </main>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const voteButton = document.querySelector('.vote-btn.up-vote');
    if (voteButton) {
        const questionId = voteButton.getAttribute('data-question-id');
        const storageKey = `voted_question_${questionId}`;
        let isVoted = localStorage.getItem(storageKey) === 'true';

        if (isVoted) {
            voteButton.classList.add('voted');
        }

        voteButton.addEventListener('click', function() {
            if (this.disabled) return;

            this.disabled = true;
            const voteCountSpan = document.querySelector('.vote-score');
            const newVotedState = !isVoted;

            fetch(`/api/questions/${questionId}/vote?isUpvote=${newVotedState}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                const voteData = data.data || data;
                if (voteData && voteData.votes !== undefined) {
                    voteCountSpan.textContent = voteData.votes;
                    isVoted = newVotedState;
                    this.classList.toggle('voted', isVoted);
                    if (isVoted) {
                        localStorage.setItem(storageKey, 'true');
                    } else {
                        localStorage.removeItem(storageKey);
                    }
                } else {
                    console.error('Unexpected response structure:', data);
                }
            })
            .catch(error => {
                console.error('There has been a problem with your fetch operation:', error);
                alert('오류가 발생했습니다. 다시 시도해주세요.');
            })
            .finally(() => {
                this.disabled = false;
            });
        });
    }
});
</script>
</body>
</html>
