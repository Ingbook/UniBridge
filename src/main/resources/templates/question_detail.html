<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${question.title} + ' | UniBridge'">Question Detail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" th:href="@{/css/UniBridge.css}" href="/css/UniBridge.css">
</head>
<body class="board-page">

<div class="board-shell">
    <aside class="board-sidebar" th:replace="~{fragments/board_sidebar :: sidebar}"></aside>

    <main class="board-feed">
        <div class="board-thread">
            <div class="board-thread-meta">
                <div class="board-thread-avatar" th:text="${question.writerName.substring(0, 1)}">U</div>
                <a th:href="@{/board(company=${question.companyName})}" class="board-thread-company" th:text="${question.companyName}">CompanyName</a>
                <span th:text="${question.writerName}">User</span>
                <time th:datetime="${question.createdAt}" th:text="${#temporals.format(question.createdAt, 'yy.MM.dd HH:mm')}">24.01.01 00:00</time>
            </div>
            <h1 class="board-thread-title" th:text="${question.title}">Question Title</h1>
            <p class="board-thread-excerpt" style="-webkit-line-clamp: unset; max-height: none;" th:text="${question.content}">Question content.</p>
            <div class="board-thread-actions">
                <button class="board-vote-button" type="button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 5l-7 7h4v6h6v-6h4z"></path>
                    </svg>
                    <span th:text="${question.votes}">0</span>
                </button>
            </div>
        </div>

        <div class="answers-section" style="margin-top: 2rem;">
            <h2 class="answers-title" th:text="${#lists.size(question.answers)} + ' Answers'">Answers</h2>

            <div th:each="answer : ${question.answers}" class="answer-card" th:classappend="${answer.accepted} ? 'accepted'">
                <div class="answer-header">
                    <span class="answer-writer" th:text="${answer.writerName}">Answer Writer</span>
                </div>
                <p class="answer-content" th:text="${answer.content}">Answer content.</p>
            </div>

            <div th:if="${#lists.isEmpty(question.answers)}" class="no-answers">
                <p>아직 답변이 없습니다. 첫 번째 답변을 달아주세요!</p>
            </div>
        </div>

        <div class="answer-form">
            <form th:action="@{/question/{questionId}/answer(questionId=${question.id})}" method="post">
                <div class="form-group">
                    <label for="content" class="answer-form-label">답변하기</label>
                    <textarea id="content" name="content" class="form-control" rows="6" placeholder="현직자의 경험을 바탕으로 답변을 남겨주세요."></textarea>
                </div>
                <div class="form-actions form-actions-centered">
                    <button type="submit" class="board-write-button" style="width: auto; padding: 0.8rem 1.5rem;">답변 등록</button>
                </div>
            </form>
        </div>
    </main>
</div>

</body>
</html>
